version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: stocktify-postgres
    restart: always
    environment:
      POSTGRES_USER: stocktify
      POSTGRES_PASSWORD: stocktify_password
      POSTGRES_DB: stocktify_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stocktify -d stocktify_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: stocktify-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: stocktify-api
    restart: always
    ports:
      - "8080:8080"
    environment:
      NODE_ENV: production
      PORT: 8080
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://stocktify:stocktify_password@postgres:5432/stocktify_db
      REDIS_URL: redis://redis:6379
      JWT_SECRET: stocktify_production_jwt_secret_key_2026
      JWT_REFRESH_SECRET: stocktify_production_jwt_refresh_secret_key_2026
      COOKIE_SECRET: stocktify_production_cookie_secret_key_2026
      FRONTEND_URL: http://localhost:5173
      CORS_ORIGINS: http://localhost:5173,http://localhost:4173
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
